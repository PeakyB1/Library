events{}

http {
    include /etc/nginx/mime.types;
    server_tokens off;
    client_max_body_size 10M;

    server {
        listen 80;
        server_name bibalary.ru www.bibalary.ru;
	return 301 https://$host$request_uri;
    }

    server {
        listen 443 ssl;
	server_name bibalary.ru www.bibalary.ru;

	ssl_certificate /etc/letsencrypt/live/bibalary.ru/fullchain.pem;
	ssl_certificate_key /etc/letsencrypt/live/bibalary.ru/privkey.pem;

        location / {
            proxy_pass http://web:8000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
	location /admin/ {
            # Разрешаем внутренние сети Docker и локалку (чтобы Nginx не путался)
            allow 172.16.0.0/12;
            allow 192.168.0.0/16;
            allow 10.0.0.0/8;

            # Твой реальный внешний IP
            allow 185.9.72.1;  

            # Все остальные идут мимо
            deny all;            

            proxy_pass http://web:8000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
        location /static/ {
            alias /app/staticfiles/;
	    include /etc/nginx/mime.types;
            types {
                application/vnd.android.package-archive apk;
            }
        }

        location /media/ {
            alias /app/media/;
        }
    }
}
